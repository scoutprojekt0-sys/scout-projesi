name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/scout-api-hardening
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Normalize PHP source encoding
        run: |
          php -r '$it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator(getcwd(), FilesystemIterator::SKIP_DOTS)); foreach ($it as $file) { if ($file->getExtension() !== "php") continue; $path = $file->getPathname(); if (str_contains($path, DIRECTORY_SEPARATOR.".git".DIRECTORY_SEPARATOR) || str_contains($path, DIRECTORY_SEPARATOR."vendor".DIRECTORY_SEPARATOR)) continue; $contents = file_get_contents($path); if ($contents === false) continue; if (strncmp($contents, "\xEF\xBB\xBF", 3) === 0) { $contents = substr($contents, 3); } $contents = str_replace(["\r\n", "\r"], "\n", $contents); file_put_contents($path, $contents); }'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          APP_ENV: local
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Detect changed PHP files
        id: changed-php
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.base_ref }}"
            git fetch origin "${base_ref}" --depth=1
            files=$(git diff --name-only "origin/${base_ref}...HEAD" -- '*.php')
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]]; then
              files=$(git diff --name-only "${before}...HEAD" -- '*.php')
            else
              files=$(git diff-tree --no-commit-id --name-only -r HEAD -- '*.php')
            fi
          else
            files=""
          fi

          files=$(echo "${files}" | grep -Ev '^(workshop/|laravel_skeleton/|socket_test\.php$)' || true)
          files=$(echo "${files}" | xargs)
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Check code style (Pint)
        if: steps.changed-php.outputs.files != ''
        run: ./vendor/bin/pint --test ${{ steps.changed-php.outputs.files }}

      - name: Skip Pint when no relevant PHP files changed
        if: steps.changed-php.outputs.files == ''
        run: echo "No relevant PHP files changed for Pint."

  security-regressions:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Normalize PHP source encoding
        run: |
          php -r '$it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator(getcwd(), FilesystemIterator::SKIP_DOTS)); foreach ($it as $file) { if ($file->getExtension() !== "php") continue; $path = $file->getPathname(); if (str_contains($path, DIRECTORY_SEPARATOR.".git".DIRECTORY_SEPARATOR) || str_contains($path, DIRECTORY_SEPARATOR."vendor".DIRECTORY_SEPARATOR)) continue; $contents = file_get_contents($path); if ($contents === false) continue; if (strncmp($contents, "\xEF\xBB\xBF", 3) === 0) { $contents = substr($contents, 3); } $contents = str_replace(["\r\n", "\r"], "\n", $contents); file_put_contents($path, $contents); }'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          APP_ENV: local
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: Create test report directory
        run: mkdir -p storage/test-reports

      - name: Run auth hardening tests
        run: php artisan test tests/Feature/AuthSecurityHardeningTest.php --log-junit storage/test-reports/auth-hardening.xml

      - name: Run admin privacy tests
        run: php artisan test tests/Feature/AdminAccessAndPrivacyTest.php --log-junit storage/test-reports/admin-privacy.xml

      - name: Upload security regression reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-regression-reports
          path: storage/test-reports/*.xml
          if-no-files-found: error

  tests:
    needs: [lint, security-regressions]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Normalize PHP source encoding
        run: |
          php -r '$it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator(getcwd(), FilesystemIterator::SKIP_DOTS)); foreach ($it as $file) { if ($file->getExtension() !== "php") continue; $path = $file->getPathname(); if (str_contains($path, DIRECTORY_SEPARATOR.".git".DIRECTORY_SEPARATOR) || str_contains($path, DIRECTORY_SEPARATOR."vendor".DIRECTORY_SEPARATOR)) continue; $contents = file_get_contents($path); if ($contents === false) continue; if (strncmp($contents, "\xEF\xBB\xBF", 3) === 0) { $contents = substr($contents, 3); } $contents = str_replace(["\r\n", "\r"], "\n", $contents); file_put_contents($path, $contents); }'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          APP_ENV: local
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test
